worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript
                  text/xml application/xml;
    gzip_min_length 1024;

    # Limite de tamanho de upload
    client_max_body_size 20M;

    # ÚNICO SERVER BLOCK - Traefik cuida do SSL e redirecionamentos externos
    server {
        listen 80;
        server_name osmech.com.br www.osmech.com.br app.osmech.com.br;

        # Raiz dos arquivos estáticos unificados
        root /var/www/osmech.com.br;

        # Landing Page (na raiz)
        location / {
            if ($host = 'app.osmech.com.br') {
                return 301 https://www.osmech.com.br/app/;
            }
            try_files $uri $uri.html $uri/ /index.html;
        }

        # _next estáticos (Landing page)
        location ^~ /_next/static/ {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, immutable";
            expires 1y;
        }

        # ── APP Flutter (/app/) ─────────────────────────────────────────────
        # ^~ garante que as regras do /app/ tenham prioridade sobre regex ~*

        location = /app/ {
            try_files /app/index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        location = /app/index.html {
            try_files /app/index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        location = /app/flutter_bootstrap.js {
            try_files /app/flutter_bootstrap.js =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        location = /app/main.dart.js {
            try_files /app/main.dart.js =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Assets do Flutter (canvaskit, icons, fonts, etc.) — cache longo OK
        location ^~ /app/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000";
            expires 1y;
        }

        location ^~ /app/canvaskit/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
            expires 1d;
        }

        # Qualquer outro recurso dentro de /app/ (^~ bloqueia regex)
        location ^~ /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        # ── Uploads (logos, imagens do usuário) ────────────────────────────
        location ^~ /uploads/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000";
            expires 1y;
        }

        # Compatibilidade para builds antigos que chamavam /api/api/...
        location ^~ /api/api/ {
            rewrite ^/api/api/(.*)$ /api/$1 break;
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Proxy para o backend Spring Boot
        location ^~ /api/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Cache para assets estáticos da landing page (fora de /app/)
        location ~* \.(js|css|png|jpg|ico|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # WASM sem cache agressivo
        location ~* \.(wasm)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
    }
}

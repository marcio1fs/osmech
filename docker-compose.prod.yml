services:

  # ── Banco de dados ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: osmech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - osmech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d oficina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osmech-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/oficina_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-marciofs426@gmail.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
      MERCADOPAGO_SUCCESS_URL: ${MERCADOPAGO_SUCCESS_URL}
      MERCADOPAGO_PENDING_URL: ${MERCADOPAGO_PENDING_URL}
      MERCADOPAGO_FAILURE_URL: ${MERCADOPAGO_FAILURE_URL}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gemini-1.5-flash}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
      WHATSAPP_TWILIO_ACCOUNT_SID: ${WHATSAPP_TWILIO_ACCOUNT_SID:-}
      WHATSAPP_TWILIO_AUTH_TOKEN: ${WHATSAPP_TWILIO_AUTH_TOKEN:-}
      WHATSAPP_TWILIO_FROM_NUMBER: ${WHATSAPP_TWILIO_FROM_NUMBER:-}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - osmech-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx — serve Flutter Web + proxy para backend ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: osmech-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # ports:
    #   - "80:80"
    #   - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.services.osmech.loadbalancer.server.port=80"
      - "traefik.http.routers.osmech.rule=Host(`osmech.com.br`) || Host(`www.osmech.com.br`) || Host(`app.osmech.com.br`)"
      - "traefik.http.routers.osmech.entrypoints=websecure"
      - "traefik.http.routers.osmech.tls.certresolver=letsencrypt"
      - "traefik.http.routers.osmech.middlewares=redirect-to-www"
      - "traefik.http.routers.osmech-api.rule=(Host(`osmech.com.br`) || Host(`www.osmech.com.br`) || Host(`app.osmech.com.br`)) && (PathPrefix(`/api/`) || PathPrefix(`/api/api/`))"
      - "traefik.http.routers.osmech-api.entrypoints=websecure"
      - "traefik.http.routers.osmech-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.osmech-api.priority=1000"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https?://osmech.com.br/(.*)"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.osmech.com.br/$${1}"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true"
      - "traefik.http.routers.osmech-http.rule=Host(`osmech.com.br`) || Host(`www.osmech.com.br`) || Host(`app.osmech.com.br`)"
      - "traefik.http.routers.osmech-http.entrypoints=web"
      - "traefik.http.routers.osmech-http.middlewares=redirect-https"
      - "traefik.http.routers.osmech-api-http.rule=(Host(`osmech.com.br`) || Host(`www.osmech.com.br`) || Host(`app.osmech.com.br`)) && (PathPrefix(`/api/`) || PathPrefix(`/api/api/`))"
      - "traefik.http.routers.osmech-api-http.entrypoints=web"
      - "traefik.http.routers.osmech-api-http.middlewares=redirect-https"
      - "traefik.http.routers.osmech-api-http.priority=1000"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/www/osmech.com.br:/var/www/osmech.com.br:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - osmech-net
      - traefik-proxy

volumes:
  postgres_data:

networks:
  osmech-net:
    driver: bridge
  traefik-proxy:
    external: true
